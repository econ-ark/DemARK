name: DemARK
channels:
  - conda-forge
dependencies:
  # Single source of the Python version for CI and for Binder.
  # HARK main requires Python >=3.12, so 3.10 breaks the pip install below.
  # The released econ-ark 0.17.2 still allows 3.10, so the floor comes from main.
  - python=3.12
  - ipywidgets
  - linearmodels
  - tqdm
  - nbval
  - pip
  - pip:
      # Install HARK from main branch to test against latest development version.
      # For reproducible builds, consider pinning to a release tag (e.g., @v0.17.0).
      - git+https://github.com/econ-ark/hark@main
