[project]
name = "demark"
version = "0.1.0"
description = "Demonstrations of how to use material in the Econ-ARK heterogeneous agents modeling toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "mystmd>=1.10.1",
]

[project.optional-dependencies]
notebooks = [
    # 0.17.2 is the first release whose expected() takes dstn=, as the Lucas and LC-Model notebooks call it.
    "econ-ark>=0.17.2",
    "ipywidgets",
    "linearmodels",
    "openpyxl",
    "seaborn",
    "statsmodels",
    # econ-ark 0.17.2 imports sympy without declaring it, and quantecon, which used to bring it in,
    # stopped requiring it in 0.12. HARK main declares it (econ-ark/HARK#1819), so this can go once
    # a release carries that.
    "sympy",
    "tqdm",
]
test = [
    "pytest",
    "pytest-xdist",
    "nbval",
]
dev = [
    "demark[notebooks,test]",
    "jupyterlab",
]
